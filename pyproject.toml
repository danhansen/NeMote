[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wordpipe"
version = "0.1.29"
description = "GNOME dictation with native Nemotron streaming ASR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wordpipe = "wordpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
