[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nemote"
version = "0.1.32"
description = "GNOME dictation with native Nemotron streaming ASR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nemote = "nemote.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
