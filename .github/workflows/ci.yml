name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CONTAINER_ENGINE: docker
      NEMOTE_DEV_IMAGE: nemote-dev:${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build reproducible development image
        run: scripts/dev-container build

      - name: Run build pipeline tests inside development image
        env:
          NEMOTE_CONTAINER_SKIP_BUILD: "1"
        run: |
          if scripts/dev-container test > build-pipeline.log 2>&1; then
            tail -40 build-pipeline.log
          else
            tail -200 build-pipeline.log
            exit 1
          fi

      - name: Preserve failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nemote-ci-build-log
          path: build-pipeline.log
          retention-days: 7
