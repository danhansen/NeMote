name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      CONTAINER_ENGINE: docker
      WORDPIPE_DEV_IMAGE: wordpipe-dev:${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build reproducible development image
        run: scripts/dev-container build

      - name: Test and package inside development image
        env:
          WORDPIPE_CONTAINER_SKIP_BUILD: "1"
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            version="dev-${GITHUB_SHA::12}"
          fi
          scripts/dev-container all "$version" dist

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wordpipe-release-assets
          path: dist/*

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
